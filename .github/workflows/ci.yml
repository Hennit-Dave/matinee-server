# Typecheck, lint, unit test, integration test and a secret scan on every push/PR, from slice 0
# (ADR 0005 — unlike Rota, which has no such gate and runs gitleaks manually, once, near submission).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # No real replica in a CI container: TEST_DATABASE_READ_URL points at the same ci database as
      # TEST_DATABASE_URL. That's enough to prove /health's replica check runs and the 503 path works
      # (health.integration.test.ts); a real replica is only provable against Neon (docs/evidence/slice-0).
      - name: Integration test
        env:
          TEST_DATABASE_ALLOWED: 'true'
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          TEST_DATABASE_READ_URL: postgresql://ci:ci@localhost:5432/ci
          TEST_REDIS_URL: redis://localhost:6379
        run: npm run test:integration

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
